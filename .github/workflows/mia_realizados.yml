name: MIA - Realizados (sob demanda)

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: mia-realizados
  cancel-in-progress: false

jobs:
  realizados:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Atualizar database (download_database.py)
        run: python download_database.py

      - name: Rodar realizados.py
        run: python realizados.py

      - name: Commit e push dos resultados
        run: |
          git config user.name "mia-bot"
          git config user.email "actions@users.noreply.github.com"
          git add database saidas
          git diff --cached --quiet || git commit -m "MIA: realizados $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: Notificar Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram_notify.py realizados

      - name: Alertar falha no Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="MIA: o run de realizados de $(date -u +'%d/%m/%Y %H:%M UTC') falhou. Veja o log em GitHub Actions."
