name: MIA - Executor diario

on:
  schedule:
    # Horarios em UTC. Brasilia = UTC-3 (sem horario de verao atualmente).
    - cron: "30 21 * * 1-5"  # 18:30 BRT, seg-sex — apos o fechamento da B3
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: mia-diario
  cancel-in-progress: false

jobs:
  executor:
    # Runner proprio (28/08) -- fila compartilhada do GitHub Actions
    # atrasou rodadas por horas em varios repos nessa semana. VPS
    # dedicada (mesma maquina do omqs_futuros_5tf), sem fila.
    runs-on: [self-hosted, self-hosted-mia_telegram]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Atualizar database (download_database.py)
        run: python download_database.py

      - name: Rodar executor.py
        env:
          SKIP_DOWNLOAD: "1"
        run: python executor.py

      - name: Atualizar historico de runs
        run: python historico_runs.py

      - name: Commit e push dos resultados
        run: |
          git config user.name "mia-bot"
          git config user.email "actions@users.noreply.github.com"
          git add database saidas log_projeto_executor_v5_5.txt
          git diff --cached --quiet || git commit -m "MIA: run automatico $(date -u +'%Y-%m-%d %H:%M UTC')"
          # rodada agendada pode disparar bem atrasada (fila do GitHub
          # Actions) e colidir com outro push feito nesse meio-tempo (ex.:
          # backfill manual) -- rebase antes do push em vez de um git push
          # cru, senão a rodada inteira se perde com "! [rejected] ...
          # (fetch first)" (aconteceu de verdade em 27/08, rodada de 26/08
          # disparando ~3h30 atrasada).
          git fetch origin main
          git rebase origin/main
          git push

      - name: Notificar Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram_notify.py executor

      - name: Alertar falha no Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="MIA: o run automatico de $(date -u +'%d/%m/%Y %H:%M UTC') falhou. Veja o log em GitHub Actions."
